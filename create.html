<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account - hams center</title>
</head>

<body>
    <h1>Create New Account - hams center</h1>

    <form action="">
        <label for="fname">full name *</label>
        <input id="fname" type="text" required>
        <br>
        <label for="tel">Phone *</label>
        <input id="tel" type="tel" required>
        <br>
        <label for="dob">data of birth</label>
        <input type="date" id="dob">
        <br>
        <label for="">Gender:</label>
        <input type="radio" id="male" name="gen">
        male
        <input type="radio" id="femle" name="gen"> female


        <br><br>
        <label for="course">Chose your courser:</label>
        <select required name="course" id="course">
            <option>Web Dip</option>
            <option>Design Dip</option>
            <option>mobile Dip</option>
            <option>laptop Dip</option>
            <option>cell Dip</option>
            <option>fluter Dip</option>
        </select>
        <br>
        <label for="price">price:*</label>
        <input type="number" id="price" required>
        <button type="submit">create</button>
    </form>

</body>

</html>
